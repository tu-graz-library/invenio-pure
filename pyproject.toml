[project]
name = "invenio-pure"
description = "Provides API for PURE."
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Graz University of Technology." }]
classifiers = ["Development Status :: 5 - Production/Stable"]
dependencies = [
  "flask-principal>=0.4.0",
  "invenio-access>=2.0.0",
  "invenio-celery>=1.2.5",
  "invenio-jobs>=3.0.0",
  "requests>=2.0.0",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/tu-graz-library/invenio-pure"

[project.entry-points."invenio_base.apps"]
invenio_pure = "invenio_pure:InvenioPure"

[project.entry-points."invenio_celery.tasks"]
invenio_pure = "invenio_pure.tasks"

[project.entry-points."invenio_jobs.jobs"]
pure_import = "invenio_pure.jobs:PureImportJob"
pure_mark_as_exported = "invenio_pure.jobs:PureMarkAsExported"
list_all_available_records = "invenio_pure.jobs:ListAllAvailableRecords"

[project.optional-dependencies]
tests = [
  "pytest-black>=0.6.0",
  "pytest-invenio>=1.4.3",
  "invenio-search[opensearch2]>=2.1.0",
  "ruff>=0.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/invenio_pure"]

[tool.isort]
profile = "black"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_decorators = false
strict = true

[tool.pytest.ini_options]
addopts = '--black --isort --pydocstyle --doctest-glob="*.rst" --doctest-modules --cov=invenio_pure --cov-report=term-missing'
testpaths = "tests invenio_pure"

[tool.ruff]
exclude = ["docs"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A005",
  "D203",
  "D211",
  "D212",
  "D213",
  "E501",
  "FA",
  "FIX",
  "INP001",
  "PERF203",
  "PLR0913",
  "RUF022",
  "S101",
  "SIM117",
  "TC001",
  "TC002",
  "TC003",
  "TC006",
  "TD",
  "TID252",
  "TRY400",
  "UP009",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)# SPDX-FileCopyrightText:\\s\\d{4}(-(\\d{4}|present))*"
